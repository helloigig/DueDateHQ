# fly.toml app configuration file generated for duedatehq on 2026-04-27T21:17:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'duedatehq'
primary_region = 'lhr'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine always running. Without this, Fly stops idle
  # machines and the in-process scraper interval (1-hour cadence in
  # backend/src/lib/scraper.ts) dies with them — leading to silent
  # no-data periods. The second machine still auto-stops when idle to
  # save on cost.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
